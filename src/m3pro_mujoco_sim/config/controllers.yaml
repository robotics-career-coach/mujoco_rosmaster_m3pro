controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    mecanum_drive_controller:
      type: mecanum_drive_controller/MecanumDriveController

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: position_controllers/JointGroupPositionController


mecanum_drive_controller:
  ros__parameters:
    front_left_joint_name: lwheel1_joint
    front_right_joint_name: rwheel1_joint
    rear_left_joint_name: lwheel2_joint
    rear_right_joint_name: rwheel2_joint

    kinematics:
      wheels_radius: 0.04
      sum_of_robot_center_projection_on_X_Y_axis: 0.211
      # sum = lx + ly = 0.0795 + 0.1315 ≈ 0.211
      # lx = half of front-rear distance = (0.0776 + 0.0814) / 2
      # ly = half of left-right distance = 0.09775 * 2 / 2 + wheel_width/2

    base_frame_id: base_link
    odom_frame_id: odom

    publish_rate: 50.0
    enable_odom_tf: true

    velocity_rolling_window_size: 10


arm_controller:
  ros__parameters:
    joints:
      - arm1_joint
      - arm2_joint
      - arm3_joint
      - arm4_joint
      - arm5_joint

    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity

    state_publish_rate: 50.0
    action_monitor_rate: 20.0

    allow_partial_joints_goal: true

    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0


gripper_controller:
  ros__parameters:
    joints:
      - rlink1_joint
